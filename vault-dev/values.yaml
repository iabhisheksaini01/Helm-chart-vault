namespace: vault

transit:
  enabled: true
  replicaCount: 1

main:
  enabled: true
  replicaCount: 4

image:
  repository: hashicorp/vault
  tag: "1.18.4"

vault:
  ui: true
  disable_mlock: true
  log_level: "info"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: vault-main
          topologyKey: kubernetes.io/hostname

persistence:
  size: 5Gi
  storageClass: ""

service:
  type: ClusterIP

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: vault.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ***************************  BACKUP CONFIG  *********************
backup:
  enabled: true
  schedule: "0 */12 * * *"
  historyLimit: 2
  vault:
    address: "http://vault-main:8200"
  minio:
    endpoint: "https://192.168.8.18:9000"
    accessKey: "minioadmin"
    secretKey: "opstreeadmin@2510"
    bucket: "vault-test"
    retentionCount: 6

# ***************************** RESTORE CONFIG **********************
restore:
  enabled: false
  snapshotName: ""

# ***************************** OIDC SSO CONFIG *********************
oidc:
  enabled: false
  discovery_url: "https://keycloak.example.com/realms/master"
  client_id: "vault-client"
  client_secret: "REPLACE_WITH_YOUR_CLIENT_SECRET"
  default_role: "oidc-user"
  # Replace with your actual Vault external URL
  vault_url: "http://vault.local"

# ***************************** RAFT AUTOPILOT **********************
autopilot:
  enabled: true
  cleanup_dead_servers: true
  last_contact_threshold: "10m"
  max_trailing_logs: 1000
